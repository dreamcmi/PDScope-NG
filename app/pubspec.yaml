name: pdscope_app
description: "PDScope 桌面版 —— USB PD / UFCS 抓包分析（Flutter 界面 + C++ 核心）"
publish_to: 'none'

# 版本号与 core 的 CMakeLists.txt / 发行包保持一致（改一处要一起改）。
version: 0.3.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 原生打开 / 保存对话框（BSD-3-Clause）。
  # 刻意不用 desktop_drop：它 Linux 侧的传递依赖 dbus 是 MPL-2.0，
  # 会给本项目引入额外的源码分发义务 —— 拖放改走平台原生实现。
  file_selector: ^1.1.0

  # 只需要 calloc / malloc 这几个分配器封装（BSD-3-Clause）。
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
