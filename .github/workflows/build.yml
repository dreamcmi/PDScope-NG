# PDScope-NG 跨平台构建
#
# Windows x64、Linux x64、macOS arm64 / x64：核心测试、Flutter 测试、
# Release 桌面编译和便携包验证。macOS 产物使用临时签名，正式分发需另行公证。
#
# 产物清单（产物名 = PDScope-NG-<目标>-<版本段>）：
#   · PDScope-NG-windows-x64-…-portable.zip  —— 桌面程序 + 命令行工具打成一个包。
#     解压后是一个目录，里面 `PDScope.exe` 与 `pdscope-cli.exe` 平级：
#       · 双击 PDScope.exe 开界面（它靠 FFI 在自身同目录找 pdscope.dll，已拷好）
#       · 双击 / 命令行跑 pdscope-cli.exe 直接导出（核心静态链接，单文件可跑）
#
# 构建顺序必须是「先 CMake 编核心 → 再 flutter build windows」：
#   runner/CMakeLists.txt 里有一条 POST_BUILD，只要 build/out/pdscope.dll 存在，
#   flutter 构建完就会自动把它拷进 exe 旁边；先跑 flutter 会拿不到这个库。

name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 同一分支串行执行：分支上「改了又推」很常见，直接把上一轮掐掉省时间。
# 标签是发版动作，不能掐，必须跑完。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # 与跨平台本机验证一致：Flutter 3.47.1 / stable。flutter-version 在 stable
  # channel 下只认**版本号**（去 release 列表里匹配），不认 commit/revision；
  # 只有 channel: master 才接受 git 引用。所以这里写版本号锁定。
  FLUTTER_VERSION: '3.47.1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            arch: x64
            note: 'Windows 10/11 x64'

    steps:
      - uses: actions/checkout@v5

      # ── 装 Flutter ────────────────────────────────────────────
      # stable channel 使用版本号锁定。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ── 定产物版本段 ───────────────────────────────────────────
      # 推 v* 标签（发版）就是纯版本号（v0.2.0），普通推送则是
      # v0.2.0_<8 位短 commit>_<YYYYMMDD>，一眼看出是哪次提交、哪天出的。
      # 版本号从 app/pubspec.yaml 读。
      - name: 定产物版本段
        shell: bash
        run: |
          ver="v$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            suffix=""
          else
            short="$(echo "${GITHUB_SHA:-$GITHUB_REF}" | cut -c1-8)"
            date="$(date -u +%Y%m%d)"
            suffix="_${short}_${date}"
          fi
          echo "VERSEG=${ver}${suffix}" >> "$GITHUB_ENV"
          echo "产物版本段：${ver}${suffix}"

      # ── 配置 MSVC 并构建核心 ──────────────────────────────────
      # 用 Ninja 生成器（与本机一致）：CMakeLists 是「单配置 Release」设计，
      # 产物直接落在 build/out/（CMAKE_RUNTIME_OUTPUT_DIRECTORY 不按配置分目录）。
      # 若改用 VS 多配置生成器，产物会多套一层 Release/ 子目录，导致 runner 里
      # 写死的 build/out/pdscope.dll 路径对不上、拷不进 exe 目录。
      # tools/msvc-env.sh 是本机受限环境专用的探测脚本，CI 里不适用。
      # 这里用 runner 自带的 vswhere 动态定位 VS，再 call vcvars64 激活 MSVC；
      # vcvars 只对当前 cmd 会话生效，所以「激活 + cmake 配置 + 构建」必须在同一个 step。
      - name: 配置并构建 C++ 核心
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # ── 核心单测 ──────────────────────────────────────────────
      - name: 核心单测
        shell: bash
        run: ./build/out/pdscope-tests.exe

      # ── Flutter 依赖与静态检查 ─────────────────────────────────
      # flutter test 需要先构建好核心（界面经 FFI 找 build/out/），上一步已完成。
      # rawdata 已入库，真实样本集成测试也在 CI 中执行。
      - name: Flutter 依赖与测试
        working-directory: app
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

      # ── 构建桌面程序 ───────────────────────────────────────────
      # 此时 build/out/pdscope.dll 已就位，runner 的 POST_BUILD 会把它拷进 exe 目录。
      - name: 构建 Windows 桌面程序
        working-directory: app
        shell: bash
        run: flutter build windows --release

      # ── 归置产物 ───────────────────────────────────────────────
      # 桌面程序是「一整个目录」（exe + flutter_windows.dll + pdscope.dll + data/），
      # 不能单独发 exe；把命令行工具也放进同一个目录，再整体压成一个 zip：
      # 解压后 PDScope.exe（双击开界面）与 pdscope-cli.exe（双击/命令行导出）平级。
      - name: 归置产物
        shell: pwsh
        run: |
          $ver = $env:VERSEG
          $bundle = "PDScope-NG-windows-x64-$ver"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          # 桌面程序整个目录摊进包根（exe + 运行时 dll + data/ 平铺）
          $rel = "app/build/windows/x64/runner/Release"
          Copy-Item "$rel/*" "$bundle/" -Recurse

          # 命令行工具平级放进包根
          Copy-Item "build/out/pdscope-cli.exe" "$bundle/pdscope-cli.exe"

          # 整体压成一个 zip
          Compress-Archive -Path "$bundle/*" -DestinationPath "$bundle-portable.zip"

          Get-ChildItem $bundle | Format-Table Name, Length -AutoSize
          Write-Host "打包完成：$bundle-portable.zip"

      # ── 逐文件 sha256 ──────────────────────────────────────────
      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $zip = "PDScope-NG-windows-x64-$env:VERSEG-portable.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Get-ChildItem $zip*

      # ── 上传 ────────────────────────────────────────────────────
      # 单文件直传（archive:false，不打二次 zip），下载下来就是包本身。
      # archive:false 时 name 参数失效，文件名直接用作 artifact 名。
      # 主文件后紧跟它的 .sha256。
      - name: 上传便携包
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-NG-windows-x64-${{ env.VERSEG }}-portable.zip
          archive: false

      - name: 上传便携包校验和
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-NG-windows-x64-${{ env.VERSEG }}-portable.zip.sha256
          archive: false

      - name: 写运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "### \`${{ matrix.name }}\`"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| runner | \`${{ matrix.os }}\` |"
            echo "| 架构 | \`${{ matrix.arch }}\` |"
            echo "| 说明 | ${{ matrix.note }} |"
          } >> "$GITHUB_STEP_SUMMARY" || true

  build-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Linux 编译与显示依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev liblzma-dev xvfb xauth dbus-x11

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: true

      - name: 定产物版本段
        run: |
          ver="v$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)"
          suffix=""
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            suffix="_${GITHUB_SHA:0:8}_$(date -u +%Y%m%d)"
          fi
          echo "VERSEG=${ver}${suffix}" >> "$GITHUB_ENV"
          echo "PDSCOPE_LIB_DIR=$GITHUB_WORKSPACE/build/native/out" >> "$GITHUB_ENV"

      - name: 构建核心并运行单测
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 3
          ctest --test-dir build/native --output-on-failure

      - name: Flutter 依赖与测试
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

      - name: 构建桌面程序
        working-directory: app
        run: flutter build ${{ matrix.platform }} --release

      - name: Linux 发行包运行检查
        if: runner.os == 'Linux'
        run: |
          bundle="app/build/linux/x64/release/bundle"
          dbus-run-session -- xvfb-run -a python3 tools/smoke-desktop.py \
            --bundle "$bundle" --sample rawdata/CTK10UL_X300U_UFCS.ufcsStream

      - name: macOS 发行包运行检查
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict app/build/macos/Build/Products/Release/PDScope.app
          python3 tools/smoke-desktop.py \
            --bundle app/build/macos/Build/Products/Release/PDScope.app \
            --sample rawdata/CTK10UL_X300U_UFCS.ufcsStream

      - name: 打包与校验和
        run: |
          bundle="PDScope-NG-${{ matrix.name }}-$VERSEG"
          mkdir -p "$bundle"
          if [[ "${{ matrix.platform }}" == macos ]]; then
            cp -R app/build/macos/Build/Products/Release/PDScope.app "$bundle/"
            cp build/native/out/pdscope-cli "$bundle/"
            cp LICENSE THIRD_PARTY_NOTICES.md "$bundle/"
            ditto -c -k --sequesterRsrc --keepParent "$bundle" "$bundle-portable.zip"
            shasum -a 256 "$bundle-portable.zip" > "$bundle-portable.zip.sha256"
          else
            cp -a app/build/linux/x64/release/bundle/. "$bundle/"
            cp build/native/out/pdscope-cli LICENSE THIRD_PARTY_NOTICES.md "$bundle/"
            tar -czf "$bundle-portable.tar.gz" "$bundle"
            sha256sum "$bundle-portable.tar.gz" > "$bundle-portable.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-NG-${{ matrix.name }}-${{ env.VERSEG }}-portable.${{ matrix.platform == 'macos' && 'zip' || 'tar.gz' }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-NG-${{ matrix.name }}-${{ env.VERSEG }}-portable.${{ matrix.platform == 'macos' && 'zip' || 'tar.gz' }}.sha256
          archive: false

  # 推 v* 标签时把全部产物汇总到一个草稿 Release。
  release:
    name: 汇总 Release
    needs: [build, build-unix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: PDScope-NG-*
          merge-multiple: true

      - run: ls -lh dist

      - name: 建 Release 并附上全部产物（已存在就补传覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f | sort)
          printf '共 %d 个文件\n' "${#files[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "PDScope-NG $GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              "${files[@]}"
          fi
